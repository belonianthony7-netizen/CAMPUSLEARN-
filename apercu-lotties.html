<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusLearn — Aperçu des Lottie intégrées</title><style>
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;background:#f7f7fa;color:#222433;padding:36px 22px}.frame{max-width:1050px;margin:auto}.top{display:flex;gap:10px;align-items:center;margin-bottom:24px}.logo{background:#1c1b28;color:white;padding:12px;border-radius:10px}.sub{font-size:13px;color:#7d7e91}h1{font-size:29px;margin:4px 0}h2{font-size:16px;margin:10px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.card{background:white;border:1px solid #e9eaf0;border-radius:12px;padding:14px;min-width:0}.scene{height:165px;border-radius:9px;display:grid;place-items:center;background:#e8f7f1}.card:nth-child(2) .scene{background:#f7f1e8}.card:nth-child(3) .scene{background:#f4effc}.card:nth-child(4) .scene{background:#eef4fa}.card:nth-child(5) .scene{background:#f6f3fb}.scene>div{height:133px;width:133px}.card p{font-size:12px;line-height:1.5;color:#7a7d8d;margin:0 0 7px}.note{font-size:11px;color:#78788a;margin-top:18px}
</style></head><body><div class="frame"><div class="top"><div class="logo">CL</div><div><div class="sub">CAMPUSLEARN · ANIMATIONS</div><h1>Des mouvements au bon moment.</h1></div></div><div class="grid" id="cards"></div><div class="note" id="stat">Chargement des animations depuis les fichiers locaux…</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script><script>
const files=[['book-loading','Chargement du catalogue','Charger les cours et le tableau de bord',true],['loading-book','Document en cours d’envoi','Attente lors du téléversement',true],['success-checkmark','Action confirmée','Inscription, leçon ou devoir validé',false],['education-certificate','Formation terminée','Progression du cours à 100 %',false],['education-animation','Aucun cours disponible','État vide et accueil du catalogue',false]];
let cards=document.querySelector('#cards');for(let [file,title,description,loop] of files){cards.insertAdjacentHTML('beforeend',`<div class="card"><div class="scene"><div id="${file}"></div></div><h2>${title}</h2><p>${description}</p></div>`)}
if(window.lottie){const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;for(let [file,title,description,loop] of files)lottie.loadAnimation({container:document.getElementById(file),renderer:'svg',loop,autoplay:!reduced,path:`frontend/public/assets/lottie/${file}.json`});document.getElementById('stat').textContent='Lecteur chargé · fichiers JSON locaux · mouvements réduits respectés.'}else{document.getElementById('stat').textContent='Lecteur CDN indisponible : vérification du rendu non effectuée (fichiers présents).'}
</script></body></html>
